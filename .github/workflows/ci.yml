name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        database: [sqlite, postgresql]
    services:
      postgres:
        # An empty image disables the service for SQLite jobs.
        image: ${{ matrix.database == 'postgresql' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: daamradar_ci
          POSTGRES_USER: daamradar_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daamradar_ci -d daamradar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.ci
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-public-key-never-use-for-a-deployed-application
      CI_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://daamradar_ci:ci-only-password@127.0.0.1:5432/daamradar_ci' || 'sqlite:///:memory:' }}
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependencies and Django configuration
        run: |
          python -m pip check
          python manage.py check --fail-level WARNING
          python manage.py makemigrations --check --dry-run
      - name: Apply migrations to an empty database
        run: python manage.py migrate --noinput
      - name: Run offline tests
        run: python manage.py test --noinput
      - name: Collect production static assets
        env:
          DJANGO_DEBUG: 'false'
          CI_STATIC_ROOT: ${{ runner.temp }}/daamradar-static
        run: python manage.py collectstatic --noinput
